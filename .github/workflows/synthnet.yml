name: Synthnet

# Synthnet is a self-contained static site with no build step and no
# dependencies. What CI is for here is holding three promises that are easy to
# break by accident and invisible when broken:
#
#   1. It works with no network at all. One absolute URL slipped into one file
#      breaks that, and nothing about the page would look wrong.
#   2. It loads quickly. The search index once reached 4.2 MB for 333 KB of
#      content and nobody noticed until it was measured.
#   3. The pages actually render. A renderer once shipped with a fatal syntax
#      error inside a build that reported success.
#
# Every step below exists because one of those already went wrong once.

on:
  push:
    paths:
      - "synthnet/**"
      - ".github/scripts/synthnet_smoke.py"
      - ".github/scripts/synthnet_user_check.py"
      - ".github/fixtures/modes/**"
      - ".github/scripts/synthnet_link_check.py"
      - ".github/scripts/synthnet_function_check.py"
      - ".github/scripts/synthnet_modes_check.py"
      - ".github/scripts/synthnet_live_check.py"
      - ".github/scripts/synthnet_slotmath_check.py"
      - ".github/workflows/synthnet.yml"
  pull_request:
    paths:
      - "synthnet/**"
      - ".github/scripts/synthnet_smoke.py"
      - ".github/scripts/synthnet_user_check.py"
      - ".github/fixtures/modes/**"
      - ".github/scripts/synthnet_link_check.py"
      - ".github/scripts/synthnet_function_check.py"
      - ".github/scripts/synthnet_modes_check.py"
      - ".github/scripts/synthnet_live_check.py"
      - ".github/scripts/synthnet_slotmath_check.py"
      - ".github/workflows/synthnet.yml"
  workflow_dispatch:

concurrency:
  # Keyed on the head commit, not github.ref: this runs on both push and
  # pull_request, which see different refs for the same commit, so a ref-keyed
  # group never collapses them and every push runs everything twice.
  group: synthnet-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Offline site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate every site against the contract
        # Schema, internal reference resolution, and the rule the whole project
        # rests on: no absolute http/https URL anywhere, bar the SVG and XHTML
        # XML namespaces. That rule is only true while something checks it.
        run: python3 synthnet/tools/validate.py --strict

      - name: Parse every renderer
        run: |
          status=0
          for f in synthnet/app/*.js synthnet/app/types/*.js synthnet/sw.js; do
            if node --check "$f"; then echo "  ok   $f"; else echo "  FAIL $f"; status=1; fi
          done
          exit $status

      - name: No renderer may hash with a double multiply
        # `h = (h * 16777619) >>> 0` is the obvious spelling of an FNV-1a
        # step and it is wrong in JavaScript: the product passes 2^53 and is
        # rounded, which destroys the LOW bits -- exactly the bits that
        # `% pool.length` reads. It made most of this network unreachable for
        # eighteen months and nothing failed, because a biased hash still
        # produces something that looks like noise.
        #
        # Nine files had a local copy of it, three of them written after the
        # fix, because everyone copies the helper next to them. So it is a
        # build failure now rather than a thing to keep rediscovering.
        run: |
          hits=$(grep -rn '\*[[:space:]]*16777619' synthnet/app synthnet/tools \
                 | grep -v 'Math.imul' | grep -v 'imul32' \
                 | grep -v '^\s*\*' | grep -v 'app/live.js' || true)
          if [ -n "$hits" ]; then
            echo "FAIL: a hash is multiplying with * instead of Math.imul."
            echo "      Use Math.imul(h, 16777619). See the note in app/live.js."
            echo "$hits"
            exit 1
          fi
          echo "  ok   every FNV step uses Math.imul"

      - name: Build, and confirm the committed generated files are current
        run: |
          python3 synthnet/tools/build.py
          python3 synthnet/tools/build.py --check

      - name: Enforce the size budget
        run: |
          # Raised to 2 MB for the push to ~100 sites; the reasoning and the
          # measurements are in tools/build.py next to SEARCH_LIMIT, which
          # must hold the same number.
          # 400 KB was set when the index held 252 documents, because search
          # only ever built documents for seven of the eighteen site types.
          # It now indexes all of them -- 492 documents at this commit, 216 KB
          # -- and roughly triples again with the content this branch adds.
          # Measured at this commit: 221,738 bytes.
          limit=2097152
          actual=$(stat -c%s synthnet/net/search.json)
          echo "search.json: $actual bytes (limit $limit)"
          if [ "$actual" -gt "$limit" ]; then
            echo "FAIL: the search index has regressed past its budget."
            exit 1
          fi

          # Everything index.html pulls in on a cold load, including all seven
          # skins and live.css, which are <link>ed unconditionally. Leaving a
          # linked file out is how this step once reported 220 KB for a 311 KB
          # payload: a budget that measures the wrong thing is worse than none.
          assets="synthnet/index.html synthnet/theme/aero.css \
                  synthnet/theme/skins/*.css synthnet/theme/live.css \
                  synthnet/theme/compose.css synthnet/theme/control.css \
                  synthnet/theme/feeds.css \
                  synthnet/app/*.js \
                  synthnet/app/types/*.js synthnet/net/registry.json \
                  synthnet/manifest.webmanifest"
          raw=0; gz=0
          for f in $assets; do
            raw=$((raw + $(stat -c%s "$f")))
            gz=$((gz + $(gzip -c "$f" | wc -c)))
          done
          echo "cold-load shell: $raw bytes raw, $gz bytes gzipped"
          # Both numbers are real: tools/serve.py gzips, so a browser moves the
          # second, but the raw figure is what the files actually weigh.
          #
          # History: 400/120 KB originally. 900/250 when the live layer
          # landed. 1600/450 when the 2026 build added ten renderers, the
          # reply engine, the fame model and the authoring UI. Raised again
          # here for the heartbeat, the alerts layer and the Feeds panel, the
          # composition grammar, and the wire, newsletter and chat renderers.
          # Measured at this commit: 1,503,598 raw / 423,360 gzipped.
          #
          # These bytes are loaded up front deliberately. Fetching them lazily
          # is the better engineering and the wrong trade here: it costs the
          # single-file standalone build, which is the mode that needs no
          # install at all. In the app and that file the bytes are local, so
          # the figure only means anything over a LAN -- where the gzipped
          # number is the one that travels, and 420 KB is under half a second
          # on anything.
          #
          # NOTE that content does NOT land here. A site.json is fetched when
          # you visit that site, so the network can keep growing without this
          # number moving. What moves it is renderers and pools.
          if [ "$raw" -gt 2097152 ]; then
            echo "FAIL: the shell payload has grown past 2 MB uncompressed."
            exit 1
          fi
          if [ "$gz" -gt 573440 ]; then
            echo "FAIL: the shell payload has grown past 560 KB gzipped."
            exit 1
          fi

      - name: The standalone single-file build must stay openable
        # dist/synthnet.html inlines the shell AND every site, which is what
        # makes it a build you can copy to a phone and open with no install.
        # It is therefore the one artifact that grows with content, and the
        # one where "just add more sites" has a real cost. 2.3 MB at this
        # commit; a phone opens that instantly. The ceiling exists so that
        # doubling the network is a decision rather than an accident.
        run: |
          actual=$(stat -c%s synthnet/dist/synthnet.html)
          echo "dist/synthnet.html: $actual bytes"
          if [ "$actual" -gt 12582912 ]; then
            echo "FAIL: the standalone build has passed 12 MB. Either trim it,"
            echo "      or decide deliberately that the single-file mode is"
            echo "      no longer the point and raise this."
            exit 1
          fi

      - name: Render every site type in a real browser
        # node --check proves a renderer parses, not that it works. This loads
        # real pages and fails on console errors, empty renders, raw inline
        # markup reaching the screen, or horizontal overflow at 360px.
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 .github/scripts/synthnet_smoke.py --root synthnet --keep-going

      - name: Posting, replies, fame, packs and persistence
        # The render test proves pages draw. It cannot prove the site does
        # anything: that a post gets replies referencing what was written,
        # that fame progresses, that a content pack survives an export/wipe/
        # import round trip, or that any of it outlives a reload. Every one of
        # those fails silently with the page still rendering perfectly, which
        # is the failure mode that has already shipped twice here.
        run: python3 .github/scripts/synthnet_user_check.py --root synthnet

      - name: The network has to actually move
        # A frozen page renders perfectly, so every other check stays green
        # while the whole premise of the project quietly stops being true.
        # This pins the clock and asserts the page moves when it moves, does
        # not move when it does not, and is busier at 9pm than at 4am.
        run: python3 .github/scripts/synthnet_live_check.py --root synthnet

      - name: Every link the app generates must resolve
        # validate.py checks the synth:// links written inside site JSON. It
        # cannot see the ones JavaScript builds at render time, and nothing
        # did: app/fame.js hardcoded five domains, three of which had never
        # been in the registry, so "gain followers and the world reacts"
        # emitted a dead link at every milestone while CI stayed green.
        # This reads the app's source AND drives it through every fame tier.
        run: python3 .github/scripts/synthnet_link_check.py --root synthnet

      - name: Everything that looks like a control has to be one
        # Every other check here asks whether a page RENDERS. This asks
        # whether it WORKS. A renderer writes el('span', {}, 'catalog') and
        # three words sit at the top of a board in link colour for a year --
        # nothing about that span is an error, it renders perfectly, and it
        # is a lie to the reader. There were fifteen of them, 453 occurrences,
        # the biggest being seven nav items on every page of eight forums.
        #
        # It cannot be answered by looking: a handler may be attached with
        # addEventListener, which leaves no trace a page can read, and this
        # app delegates clicks from #synth-viewport, so every element has a
        # listener above it. So pass 2 PRESSES each distinct control and
        # watches for the route, the DOM or the scroll to move. Likewise a
        # dead end is found by asking each site for a path that cannot exist
        # and recognising that answer, rather than guessing at its wording.
        run: python3 .github/scripts/synthnet_function_check.py --root synthnet --pages 6

      - name: Every renderer mode has to render once
        # You cannot render a route no site serves, so a renderer can ship
        # having never run. Four did: wire, newsletter, chat, and the three
        # modes news gained. Three threw on first contact with data and the
        # fourth drew the wrong thing, and no check here could see any of it.
        # So this brings its own sites -- .github/fixtures/modes, staged into
        # a throwaway tree -- and nothing on the network has to keep a
        # liveblog open for it to go on working.
        run: python3 .github/scripts/synthnet_modes_check.py --root synthnet

      - name: The Java clock and the JavaScript clock must agree
        # The widget recomputes its counts natively, because when the app is
        # closed there is no WebView to ask and a cached number would be wrong
        # within minutes. That is a duplicate implementation of the one
        # function this whole project rests on, and the two languages disagree
        # about arithmetic unless you are careful: they differed on 863 of
        # 1304 answers the first time this ran.
        run: python3 .github/scripts/synthnet_slotmath_check.py --root synthnet

      - name: Build the Android app
        # ubuntu-latest ships the Android SDK, and the app uses only framework
        # APIs, so there is nothing to resolve or download -- aapt2, javac, d8
        # and apksigner, about a minute.
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bash synthnet/android/build.sh

      - name: The app must hold no network permission
        # The offline guarantee rests on the app having no INTERNET permission,
        # which makes it enforced by Android rather than promised in a README.
        #
        # This used to assert zero permissions of any kind. It now asserts an
        # allowlist, because local notifications need two and neither of them
        # grants network access: POST_NOTIFICATIONS (a runtime prompt) and
        # RECEIVE_BOOT_COMPLETED (so the alarm survives a restart). The
        # process still cannot open a socket. The home-screen widget, which
        # is the half of that feature that cannot be throttled or declined,
        # needs no permission at all.
        #
        # An allowlist is stricter than it sounds: anything not named below
        # fails, so adding INTERNET, ACCESS_NETWORK_STATE, a location
        # permission or a foreground-service type all fail the build the same
        # way a count would have.
        run: |
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          AAPT2="$ANDROID_HOME/build-tools/$BT/aapt2"
          ALLOWED="android.permission.POST_NOTIFICATIONS
          android.permission.RECEIVE_BOOT_COMPLETED"

          GOT=$("$AAPT2" dump badging synthnet/android/synthnet.apk \
                | grep -oE "uses-permission[^:]*: name='[^']+'" \
                | sed "s/.*name='//;s/'//" | sort -u || true)
          echo "declared permissions:"
          echo "$GOT" | sed 's/^/  /'

          status=0
          for p in $GOT; do
            case "$p" in
              android.permission.POST_NOTIFICATIONS) ;;
              android.permission.RECEIVE_BOOT_COMPLETED) ;;
              *)
                echo "FAIL: $p is not on the allowlist."
                status=1
                ;;
            esac
          done
          # Named explicitly as well, so the failure says the right thing if
          # the loop above is ever loosened by accident.
          if echo "$GOT" | grep -qE "INTERNET|ACCESS_NETWORK_STATE"; then
            echo "FAIL: the app asked for network access. The whole project"
            echo "      rests on Android refusing it one."
            status=1
          fi
          exit $status

      - name: The widget and the alarm must survive the build
        # d8 has silently dropped a class here before (an anonymous
        # WebChromeClient it could not resolve), with a bare NPE naming no
        # source file. A widget that is not in the dex is a widget that never
        # appears in the picker, and nothing else would notice.
        run: |
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          AAPT2="$ANDROID_HOME/build-tools/$BT/aapt2"
          status=0
          CLASSES=$(unzip -p synthnet/android/synthnet.apk classes.dex | strings \
                    | grep -oE "Lnet/verity/synthnet/[A-Za-z]+;" | sort -u)
          for c in SynthWidget AlertAlarm Bridge Snapshot SlotMath MainActivity; do
            if echo "$CLASSES" | grep -q "Lnet/verity/synthnet/$c;"; then
              echo "  ok   $c"
            else
              echo "  FAIL $c is not in the dex"
              status=1
            fi
          done
          for r in res/xml/widget_info.xml res/layout/widget.xml; do
            if unzip -l synthnet/android/synthnet.apk | grep -q "${r##*/}"; then
              echo "  ok   ${r##*/}"
            else
              echo "  FAIL ${r##*/} is not in the APK"
              status=1
            fi
          done
          exit $status

      - name: The APK must contain everything the page fetches
        # Structural checks cannot catch a file that was never staged into
        # assets/ -- the APK would be valid and the page would break. This
        # drives the real site, records every URL it requests, and asserts each
        # one is inside the APK.
        run: python3 .github/scripts/synthnet_apk_check.py --apk synthnet/android/synthnet.apk --root synthnet

      - name: Publish the Android app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthnet-android-apk
          path: synthnet/android/synthnet.apk
          if-no-files-found: error

      - name: Publish the standalone single-file build
        # dist/ is gitignored because it is generated. Uploading it here keeps
        # the current build one download from the Actions run, which is the
        # point of the standalone mode: copy this one file to a phone, open it,
        # no install and no server.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthnet-standalone
          path: synthnet/dist/synthnet.html
          if-no-files-found: error
