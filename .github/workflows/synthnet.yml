name: Synthnet

# Synthnet is a self-contained static site with no build step and no
# dependencies. What CI is for here is holding three promises that are easy to
# break by accident and invisible when broken:
#
#   1. It works with no network at all. One absolute URL slipped into one file
#      breaks that, and nothing about the page would look wrong.
#   2. It loads quickly. The search index once reached 4.2 MB for 333 KB of
#      content and nobody noticed until it was measured.
#   3. The pages actually render. A renderer once shipped with a fatal syntax
#      error inside a build that reported success.
#
# Every step below exists because one of those already went wrong once.

on:
  push:
    paths:
      - "synthnet/**"
      - ".github/scripts/synthnet_smoke.py"
      - ".github/scripts/synthnet_user_check.py"
      - ".github/scripts/synthnet_link_check.py"
      - ".github/scripts/synthnet_live_check.py"
      - ".github/workflows/synthnet.yml"
  pull_request:
    paths:
      - "synthnet/**"
      - ".github/scripts/synthnet_smoke.py"
      - ".github/scripts/synthnet_user_check.py"
      - ".github/scripts/synthnet_link_check.py"
      - ".github/scripts/synthnet_live_check.py"
      - ".github/workflows/synthnet.yml"
  workflow_dispatch:

concurrency:
  # Keyed on the head commit, not github.ref: this runs on both push and
  # pull_request, which see different refs for the same commit, so a ref-keyed
  # group never collapses them and every push runs everything twice.
  group: synthnet-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Offline site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate every site against the contract
        # Schema, internal reference resolution, and the rule the whole project
        # rests on: no absolute http/https URL anywhere, bar the SVG and XHTML
        # XML namespaces. That rule is only true while something checks it.
        run: python3 synthnet/tools/validate.py --strict

      - name: Parse every renderer
        run: |
          status=0
          for f in synthnet/app/*.js synthnet/app/types/*.js synthnet/sw.js; do
            if node --check "$f"; then echo "  ok   $f"; else echo "  FAIL $f"; status=1; fi
          done
          exit $status

      - name: Build, and confirm the committed generated files are current
        run: |
          python3 synthnet/tools/build.py
          python3 synthnet/tools/build.py --check

      - name: Enforce the size budget
        run: |
          # 400 KB was set when the index held 252 documents, because search
          # only ever built documents for seven of the eighteen site types.
          # It now indexes all of them -- 492 documents at this commit, 216 KB
          # -- and roughly triples again with the content this branch adds.
          # Measured at this commit: 221,738 bytes.
          limit=1048576
          actual=$(stat -c%s synthnet/net/search.json)
          echo "search.json: $actual bytes (limit $limit)"
          if [ "$actual" -gt "$limit" ]; then
            echo "FAIL: the search index has regressed past its budget."
            exit 1
          fi

          # Everything index.html pulls in on a cold load, including all seven
          # skins and live.css, which are <link>ed unconditionally. Leaving a
          # linked file out is how this step once reported 220 KB for a 311 KB
          # payload: a budget that measures the wrong thing is worse than none.
          assets="synthnet/index.html synthnet/theme/aero.css \
                  synthnet/theme/skins/*.css synthnet/theme/live.css \
                  synthnet/theme/compose.css synthnet/theme/control.css \
                  synthnet/app/*.js \
                  synthnet/app/types/*.js synthnet/net/registry.json \
                  synthnet/manifest.webmanifest"
          raw=0; gz=0
          for f in $assets; do
            raw=$((raw + $(stat -c%s "$f")))
            gz=$((gz + $(gzip -c "$f" | wc -c)))
          done
          echo "cold-load shell: $raw bytes raw, $gz bytes gzipped"
          # Both numbers are real: tools/serve.py gzips, so a browser moves the
          # second, but the raw figure is what the files actually weigh.
          # History: 400/120 KB originally, 900/250 when the live layer landed,
          # 1600/450 now that the 2026 build added ten renderers, the reply
          # engine, the fame model and the authoring UI. Measured at this
          # commit: 1,208,404 raw / 332,687 gzipped.
          #
          # These bytes are loaded up front deliberately. Fetching them lazily
          # is the better engineering and the wrong trade here: it costs the
          # single-file standalone build, which is the mode that needs no
          # install at all. In the app and that file the bytes are local, so
          # the figure only means anything over a LAN -- where the gzipped
          # number is the one that travels, and 330 KB is a third of a second
          # on anything. Headroom left for packs and more sites.
          if [ "$raw" -gt 1638400 ]; then
            echo "FAIL: the shell payload has grown past 1.6 MB uncompressed."
            exit 1
          fi
          if [ "$gz" -gt 460800 ]; then
            echo "FAIL: the shell payload has grown past 450 KB gzipped."
            exit 1
          fi

      - name: Render every site type in a real browser
        # node --check proves a renderer parses, not that it works. This loads
        # real pages and fails on console errors, empty renders, raw inline
        # markup reaching the screen, or horizontal overflow at 360px.
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 .github/scripts/synthnet_smoke.py --root synthnet --keep-going

      - name: Posting, replies, fame, packs and persistence
        # The render test proves pages draw. It cannot prove the site does
        # anything: that a post gets replies referencing what was written,
        # that fame progresses, that a content pack survives an export/wipe/
        # import round trip, or that any of it outlives a reload. Every one of
        # those fails silently with the page still rendering perfectly, which
        # is the failure mode that has already shipped twice here.
        run: python3 .github/scripts/synthnet_user_check.py --root synthnet

      - name: The network has to actually move
        # A frozen page renders perfectly, so every other check stays green
        # while the whole premise of the project quietly stops being true.
        # This pins the clock and asserts the page moves when it moves, does
        # not move when it does not, and is busier at 9pm than at 4am.
        run: python3 .github/scripts/synthnet_live_check.py --root synthnet

      - name: Every link the app generates must resolve
        # validate.py checks the synth:// links written inside site JSON. It
        # cannot see the ones JavaScript builds at render time, and nothing
        # did: app/fame.js hardcoded five domains, three of which had never
        # been in the registry, so "gain followers and the world reacts"
        # emitted a dead link at every milestone while CI stayed green.
        # This reads the app's source AND drives it through every fame tier.
        run: python3 .github/scripts/synthnet_link_check.py --root synthnet

      - name: Build the Android app
        # ubuntu-latest ships the Android SDK, and the app uses only framework
        # APIs, so there is nothing to resolve or download -- aapt2, javac, d8
        # and apksigner, about a minute.
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bash synthnet/android/build.sh

      - name: The app must hold no permissions
        # The offline guarantee rests on the app having no INTERNET permission,
        # which makes it enforced by Android rather than promised in a README.
        # A future edit adding one would silently dissolve that, so it fails
        # the build instead.
        run: |
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          AAPT2="$ANDROID_HOME/build-tools/$BT/aapt2"
          n=$("$AAPT2" dump badging synthnet/android/synthnet.apk | grep -c "uses-permission" || true)
          echo "uses-permission entries: $n"
          if [ "$n" -ne 0 ]; then
            echo "FAIL: the app declares a permission. It must declare none."
            "$AAPT2" dump badging synthnet/android/synthnet.apk | grep "uses-permission"
            exit 1
          fi

      - name: The APK must contain everything the page fetches
        # Structural checks cannot catch a file that was never staged into
        # assets/ -- the APK would be valid and the page would break. This
        # drives the real site, records every URL it requests, and asserts each
        # one is inside the APK.
        run: python3 .github/scripts/synthnet_apk_check.py --apk synthnet/android/synthnet.apk --root synthnet

      - name: Publish the Android app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthnet-android-apk
          path: synthnet/android/synthnet.apk
          if-no-files-found: error

      - name: Publish the standalone single-file build
        # dist/ is gitignored because it is generated. Uploading it here keeps
        # the current build one download from the Actions run, which is the
        # point of the standalone mode: copy this one file to a phone, open it,
        # no install and no server.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthnet-standalone
          path: synthnet/dist/synthnet.html
          if-no-files-found: error
